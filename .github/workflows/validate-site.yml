name: Validate site metadata

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Check every public page
        run: |
          node scripts/build-releases.mjs --check
          node scripts/validate-pages.mjs
